name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 1

      - name: "Fail on type: ignore (no suppressions allowed)"
        run: |
          if grep -rE '# type: ignore|# ty: ignore' --include='*.py' . --exclude-dir=.venv --exclude-dir=.git; then
            echo "::error::type: ignore / ty: ignore comments are not allowed. Fix the underlying type errors instead."
            exit 1
          fi
          exit 0

      - name: Validate .env.example matches Settings schema
        run: |
          uv run python -c "
          from pathlib import Path
          from dotenv import dotenv_values
          from config.settings import Settings
          import importlib.resources
          env_path = importlib.resources.files('cli').joinpath('env.example')
          if not env_path.is_file():
              env_path = Path('.env.example')
          if env_path.is_file():
              values = dotenv_values(env_path)
              Settings(**values)
              print(f'.env.example validated OK ({len(values)} vars)')
          else:
              print('No .env.example found, skipping validation')
          "

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-python: true

      - name: Format check
        run: uv run ruff format --check

      - name: Style check
        run: uv run ruff check

      - name: Security check (Ruff bandit rules)
        run: uv run ruff check --select S

      - name: Dependency vulnerability scan
        run: >-
          uv run pip-audit ||
          echo 'pip-audit not available; install it with: uv tool install pip-audit'

      - name: Type check
        run: uv run ty check

      - name: Run tests
        env:
          PYTHONWARNINGS: error
        run: uv run pytest -v --tb=short
